services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: eventhub-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "EventHub123!"
    ports:
      - "1433:1433"
    volumes:
      - eventhub-sql-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "EventHub123!" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: src/EventHub.Api/Dockerfile
    container_name: eventhub-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=EventHubDb;User Id=sa;Password=EventHub123!;TrustServerCertificate=True;
      FileStorage__UploadPath: /app/uploads
    volumes:
      - eventhub-uploads:/app/uploads
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  eventhub-sql-data:
  eventhub-uploads:
